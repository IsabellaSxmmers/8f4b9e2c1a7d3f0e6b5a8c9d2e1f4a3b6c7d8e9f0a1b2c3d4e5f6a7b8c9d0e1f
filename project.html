<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#0A0A0B">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/styles.css?v=8">
</head>
<body>
  <div class="project">
    <div class="project-glow" aria-hidden="true"></div>

    <header class="site-header is-static">
      <nav class="nav container" aria-label="Primary">
        <a class="brand" href="index.html">Isabella Sommers</a>
        <div class="nav-links">
          <a href="index.html#about">About</a>
          <a href="index.html#tools">Tools</a>
          <a href="index.html#work">Work</a>
          <a href="index.html#contact">Contact</a>
        </div>
        <button class="menu-btn" type="button" aria-expanded="false" aria-controls="mobile-menu">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span class="menu-label">Menu</span>
        </button>
      </nav>
      <div id="mobile-menu" class="mobile-menu" hidden>
        <a href="index.html#about">About</a>
        <a href="index.html#tools">Tools</a>
        <a href="index.html#work">Work</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </header>

    <main>
      <section class="project-hero container">
        <h1 id="project-title" class="project-title"></h1>
        <div class="meta">
          <span id="project-category" class="category"><span class="dot"></span><span class="cat-label"></span></span>
          <span class="meta-sep" aria-hidden="true"></span>
          <span id="project-year"></span>
        </div>
        <div id="project-tags" class="tags-row"></div>
      </section>

      <section id="project-copy" class="container project-copy">
        <p id="project-desc" class="copy-main"></p>
        <p id="project-program" class="copy-side"></p>
      </section>

      <section class="container" aria-label="Project media">
        <div id="media-frame" class="media-frame">
          <div id="media-inner" class="media-inner">
            <div class="media-placeholder">
              <span class="play"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></span>
              <span>Media coming soon</span>
            </div>
          </div>
        </div>
        <div class="media-open-wrap">
          <a id="media-open" class="media-open" href="#" target="_blank" rel="noopener" hidden>
            <span class="open-label">Open</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
          </a>
        </div>
      </section>

      <div class="back-wrap">
        <a class="back" href="index.html#work">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          Back to work
        </a>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>Isabella Sommers</span>
        <span>Portfolio 2026</span>
      </div>
    </footer>
  </div>

  <script src="js/projects.js?v=8"></script>
  <script src="js/media.js?v=8"></script>
  <script src="js/project.js?v=8"></script>
  <script src="js/main.js?v=8"></script>

</html>
